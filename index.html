<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trading Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232962ff'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#131722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terminal">
<link rel="stylesheet" href="css/app.css?v=9">
<!-- Lightweight Charts — otwartoźródłowa biblioteka wykresów od TradingView (Apache-2.0) -->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo"><div class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/></svg></div>Terminal</div>
    <div class="sep"></div>
    <label class="symbol-box" title="Symbol (Enter, aby załadować)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="symbol-input" spellcheck="false" autocomplete="off">
    </label>
    <div class="sep"></div>
    <div id="tf-buttons" style="display:flex;gap:2px"></div>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-replay" title="Replay / symulator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5v14M8 12l10-7v14z"/></svg>Replay</button>
    <button class="tb-btn" id="btn-live" title="Pełny wykres TradingView na żywo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Live</button>
    <div class="spacer"></div>
    <select id="account-select" class="top-select" title="Konto"></select>
    <button class="tb-btn" id="btn-check" title="Checklista przed wejściem — sprawdź, zanim klikniesz BUY/SELL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg><span class="lbl">Przed wejściem</span></button>
    <button class="tb-btn" id="btn-new-trade" title="Dodaj transakcję"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="sync-badge" id="sync-badge"><span class="sync-dot"></span><span class="txt">Lokalnie</span></span>
    <button class="tb-btn accent" id="btn-auth">Zaloguj</button>
  </header>

  <div id="workspace">
    <aside id="tools"></aside>
    <main id="main">
      <section id="view-chart">
        <div id="chart-wrap">
          <div id="chart"></div>
          <div class="chart-legend" id="chart-legend"></div>
          <div class="chart-msg hidden" id="chart-msg"></div>
          <div class="news-banner hidden" id="news-banner"></div>
          <div class="replay-hint hidden" id="replay-hint">Replay: kliknij świecę, od której chcesz zacząć. Potem ▶ odtwarza wykres, a przyciskami Kup / Sprzedaj otwierasz pozycję (wpisz ilość, SL i TP).</div>
          <div class="replay-bar hidden" id="replay-bar"></div>
        </div>
        <div id="bottom">
          <div class="bp-tabs" id="bp-tabs"></div>
          <div class="bp-body" id="bp-body"></div>
        </div>
      </section>
      <section id="view-page" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0"></section>
    </main>
    <aside id="side"></aside>
    <nav id="rail"></nav>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="js/util.js?v=9"></script>
<script src="js/store.js?v=9"></script>
<script src="js/sync.js?v=9"></script>
<script src="js/stats.js?v=9"></script>
<script src="js/importers.js?v=9"></script>
<script src="js/chart.js?v=9"></script>
<script src="js/coach.js?v=9"></script>
<script src="js/views/learn.js?v=9"></script>
<script src="js/views/start.js?v=9"></script>
<script src="js/views/journal.js?v=9"></script>
<script src="js/views/calendar.js?v=9"></script>
<script src="js/views/analytics.js?v=9"></script>
<script src="js/views/prop.js?v=9"></script>
<script src="js/views/econ.js?v=9"></script>
<script src="js/views/ai.js?v=9"></script>
<script src="js/views/settings.js?v=9"></script>
<script src="js/app.js?v=9"></script>
</body>
</html>
